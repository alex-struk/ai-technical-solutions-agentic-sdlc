apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devworkspace-repos-manager
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devworkspace-repos-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devworkspace-repos-manager
subjects:
  - kind: ServiceAccount
    name: default
