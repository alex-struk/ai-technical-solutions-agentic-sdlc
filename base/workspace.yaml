kind: DevWorkspace
apiVersion: workspace.devfile.io/v1alpha2
metadata:
  name: my-workspace
spec:
  started: true
  template:
    attributes:
      controller.devfile.io/storage-type: ephemeral
      controller.devfile.io/devworkspace-idle-timeout: "-1"
    components:
      - name: tooling
        container:
          image: quay.io/devfile/universal-developer-image@sha256:f4b3810b4a81afe9f17ca833d27c96053c2c87d668ab9ee9a4b36ffa3ee6df40
          memoryLimit: 2Gi
          memoryRequest: 256Mi
          cpuRequest: 100m
          cpuLimit: 500m
          mountSources: true
          env:
            - name: CODE_HOST
              value: "0.0.0.0"
            - name: CONNECTION_TOKEN
              value: REPLACE_CONNECTION_TOKEN
            - name: CHE_MACHINE_NAME
              value: tooling
            - name: DEVWORKSPACE_COMPONENT_NAME
              value: tooling
            - name: SHELL
              value: /bin/bash
            - name: CHE_PLUGIN_REGISTRY_URL
              value: ""
            - name: CHE_PLUGIN_REGISTRY_INTERNAL_URL
              value: ""
            - name: CHE_DASHBOARD_URL
              value: ""
            - name: DEVWORKSPACE_TELEMETRY_BACKEND_PORT
              value: ""
            - name: GITHUB_TOKEN
              value: REPLACE_GITHUB_TOKEN
            - name: GIT_USER_NAME
              value: REPLACE_GIT_USER_NAME
            - name: GIT_USER_EMAIL
              value: REPLACE_GIT_USER_EMAIL
          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              sleep 5
              if ! whoami &> /dev/null; then
                if [ -w /etc/passwd ]; then
                  echo "${USER_NAME:-user}:x:$(id -u):0:${USER_NAME:-user} user:${HOME}:/bin/bash" >> /etc/passwd
                  echo "${USER_NAME:-user}:x:$(id -u):" >> /etc/group
                fi
              fi
              export DEVWORKSPACE_POD_NAME=$(hostname)
              mkdir -p /home/user/.kube
              cat > /home/user/.kube/config <<KUBEEOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  server: https://kubernetes.default.svc
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                name: in-cluster
              contexts:
              - context:
                  cluster: in-cluster
                  namespace: ${DEVWORKSPACE_NAMESPACE:-fd34fb-prod}
                name: in-cluster
              current-context: in-cluster
              users:
              - name: in-cluster
                user:
                  tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              KUBEEOF
              mkdir -p /checode/remote/data/User
              cat > /checode/remote/data/User/settings.json <<'SETTINGSEOF'
              {
                "terminal.integrated.defaultProfile.linux": "bash",
                "terminal.integrated.profiles.linux": {
                  "bash": {
                    "path": "/bin/bash",
                    "args": []
                  }
                },
                "terminal.integrated.env.linux": {}
              }
              SETTINGSEOF
              git config --global user.name "$GIT_USER_NAME"
              git config --global user.email "$GIT_USER_EMAIL"
              git config --global credential.helper '!f() { echo "username=git"; echo "password=$GITHUB_TOKEN"; }; f'
              echo "Cloning repos from devworkspace-repo ConfigMaps..."
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CA_CERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              REPO_URLS=$(curl -sf --cacert "$CA_CERT" -H "Authorization: Bearer $SA_TOKEN" \
                "https://kubernetes.default.svc/api/v1/namespaces/$NS/configmaps?labelSelector=devworkspace-repo%3Dtrue" \
                | grep -o '"url": *"[^"]*"' | sed 's/"url": *"\([^"]*\)"/\1/' || true)
              mkdir -p /projects
              for url in $REPO_URLS; do
                repo_name=$(basename "$url" .git)
                if [ ! -d "/projects/$repo_name" ]; then
                  echo "Cloning $url -> /projects/$repo_name"
                  git clone "$url" "/projects/$repo_name" || echo "WARN: Failed to clone $url"
                fi
              done
              echo "Repo cloning complete."
              export MACHINE_EXEC_PORT=3333
              nohup /checode/bin/machine-exec --url "127.0.0.1:${MACHINE_EXEC_PORT}" &
              export VSCODE_AGENT_FOLDER=/checode/remote
              cd /checode/checode-linux-libc/ubi8
              export VSCODE_NODEJS_RUNTIME_DIR="$(pwd)"
              export LD_LIBRARY_PATH="/checode/checode-linux-libc/ubi8/ld_libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              exec "$VSCODE_NODEJS_RUNTIME_DIR/node" out/server-main.js \
                --host 0.0.0.0 \
                --port 3100 \
                --connection-token "$CONNECTION_TOKEN" \
                --force-disable-user-env \
                --default-folder /projects
          volumeMounts:
            - name: checode
              path: /checode
          endpoints:
            - name: che-code
              targetPort: 3100
              exposure: public
              secure: true
              protocol: https
              attributes:
                type: main
                cookiesAuthEnabled: false
                discoverable: false
                urlRewriteSupported: false
      - name: che-code-injector
        attributes:
          controller.devfile.io/init-container: true
        container:
          image: quay.io/che-incubator/che-code@sha256:c4f28b391ca710e14d20fbfab038ca949b308ce8a57b4add9929720def04f907
          command: ["/bin/sh"]
          args: ["-c", "/entrypoint-init-container.sh && sleep infinity"]
          volumeMounts:
            - name: checode
              path: /checode
          memoryLimit: 256Mi
          memoryRequest: 32Mi
          cpuLimit: 500m
          cpuRequest: 30m
      - name: checode
        volume: {}
