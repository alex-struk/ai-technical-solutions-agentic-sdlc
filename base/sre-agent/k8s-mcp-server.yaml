apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp-server
  labels:
    app: k8s-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp-server
  template:
    metadata:
      labels:
        app: k8s-mcp-server
    spec:
      serviceAccountName: sre-agent
      containers:
        - name: k8s-mcp-server
          image: ghcr.io/manusa/kubernetes-mcp-server:0.0.31
          args:
            - --transport
            - sse
            - --sse-address
            - "0.0.0.0"
            - --sse-port
            - "8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-mcp-server
  labels:
    app: k8s-mcp-server
spec:
  selector:
    app: k8s-mcp-server
  ports:
    - port: 8080
      targetPort: 8080
