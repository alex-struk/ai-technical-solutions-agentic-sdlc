apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  labels:
    app: sre-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent
  labels:
    app: sre-agent
rules:
  # Monitor pods, logs, events
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list", "watch"]
  # Monitor deployments and replicasets
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Create Tekton PipelineRuns for remediation
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent
  labels:
    app: sre-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sre-agent
subjects:
  - kind: ServiceAccount
    name: sre-agent
