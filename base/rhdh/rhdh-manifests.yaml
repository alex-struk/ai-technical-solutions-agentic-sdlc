          rules:
            - allow: [Template]
    backend:
      auth:
        externalAccess:
        - options:
            secret: ${BACKEND_SECRET}
            subject: legacy-default-config
          type: legacy
      baseUrl: https://rhdh-developer-hub-fd34fb-prod.apps.silver.devops.gov.bc.ca
