apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: hello-world-nodejs
  title: Hello World Node.js Service
  description: Creates a Node.js Express app with GitHub Actions CI/CD and OpenShift deployment manifests. Requires OC_TOKEN secret in the scaffolded repo.
  tags:
    - nodejs
    - express
    - openshift
spec:
  owner: group:default/team
  type: service

  parameters:
    - title: Provide component information
      required:
        - component_id
        - owner
      properties:
        component_id:
          title: Component ID
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
        description:
          title: Description
          type: string
          description: A short description of the component
          default: A simple hello world Node.js service
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Choose a repository location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: template
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        repoVisibility: public
        description: ${{ parameters.description }}
        defaultBranch: main

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: devworkspace-repo
      name: Register in DevWorkspace
      action: kubernetes:apply
      input:
        namespaced: true
        clusterName: local
        manifest: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: repo-${{ parameters.component_id }}
            labels:
              devworkspace-repo: "true"
          data:
            url: ${{ steps['publish'].output.remoteUrl }}

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: GitHub Actions
        url: ${{ steps['publish'].output.remoteUrl }}/actions
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
