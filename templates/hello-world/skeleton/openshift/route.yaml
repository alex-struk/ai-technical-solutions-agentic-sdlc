apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ${{values.component_id}}
  labels:
    app: ${{values.component_id}}
spec:
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: ${{values.component_id}}
