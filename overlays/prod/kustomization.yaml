apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fd34fb-prod
resources:
  - ../../base
replacements:
  - source:
      kind: ConfigMap
      name: workspace-config
      fieldPath: data.CONNECTION_TOKEN
    targets:
      - select:
          kind: DevWorkspace
          name: my-workspace
        fieldPaths:
          - spec.template.components.[name=tooling].container.env.[name=CONNECTION_TOKEN].value
  - source:
      kind: ConfigMap
      name: workspace-config
      fieldPath: data.SERVICE_NAME
    targets:
      - select:
          kind: Route
          name: my-workspace-ide
        fieldPaths:
          - spec.to.name
configMapGenerator:
  - name: workspace-config
    envs:
      - .env
    options:
      disableNameSuffixHash: true
