apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fd34fb-prod
resources:
  - ../../../base/rhdh
secretGenerator:
  - name: rhdh-github-secrets
    envs:
      - .env
    options:
      disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: rhdh-developer-hub
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: rhdh-github-secrets
